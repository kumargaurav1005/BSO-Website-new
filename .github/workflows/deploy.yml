
name: Deploy BSO Website

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kumargaurav1005/bso-website

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/kumargaurav1005/bso-website:latest
            ghcr.io/kumargaurav1005/bso-website:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -eu

            CONTAINER="bso-website"
            IMAGE="ghcr.io/kumargaurav1005/bso-website:latest"

            # Save the currently running image for rollback
            OLD_IMAGE_ID=$(sudo docker inspect \
              --format='{{.Image}}' "$CONTAINER")

            # Login and pull the new image before replacing the container
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io \
              -u "$GHCR_USER" --password-stdin

            sudo docker pull "$IMAGE"

            # Replace the running container
            sudo docker rm -f "$CONTAINER"

            if ! sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --init \
              -p 127.0.0.1:3000:3000 \
              "$IMAGE"; then

              echo "New container failed to start; rolling back"

              sudo docker rm -f "$CONTAINER" || true

              sudo docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                --init \
                -p 127.0.0.1:3000:3000 \
                "$OLD_IMAGE_ID"

              exit 1
            fi

            # Health check for up to 60 seconds
            HEALTHY=0

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
                HEALTHY=1
                break
              fi

              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Health check failed; restoring previous image"

              sudo docker logs --tail 100 "$CONTAINER" || true
              sudo docker rm -f "$CONTAINER" || true

              sudo docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                --init \
                -p 127.0.0.1:3000:3000 \
                "$OLD_IMAGE_ID"

              # Verify the restored website
              for i in $(seq 1 15); do
                if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
                  echo "Rollback successful; previous image restored"
                  exit 1
                fi

                sleep 2
              done

              echo "Rollback health check failed; manual recovery required"
              sudo docker logs --tail 100 "$CONTAINER" || true
              exit 1
            fi

            echo "Website health check passed"
            sudo docker logout ghcr.io || true
